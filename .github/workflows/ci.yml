name: CI

# Phase G CI. Blocking jobs fail the build; explicitly non-blocking jobs
# are marked `continue-on-error: true` and the reason is documented in
# docs/phase-g-report.md and docs/SECURITY.md -- they must never be
# read as "clean". Coverage is gated at 80% (measured 91% on the
# phase-g branch, 122 backend tests); the gate fails below 80%.
on:
  push:
    branches: ["main", "master", "develop", "phase-*"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests + Coverage Gate (>=80%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run tests with coverage gate
        working-directory: ./backend
        env:
          # Placeholder -- unit tests mock all OpenAI calls
          OPENAI_API_KEY: "test-placeholder-key"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          QDRANT_HOST: ":memory:"
          # Secret must be >=32 chars for JWT to work
          JWT_SECRET_KEY: "ci-test-secret-key-minimum-32-chars-long"
          ENVIRONMENT: "test"
        run: |
          python -m pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7

      - name: Upload coverage to Codecov (optional, non-blocking)
        uses: codecov/codecov-action@v7
        with:
          file: ./backend/coverage.xml
        continue-on-error: true

  backend-lint:
    name: Backend Ruff (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.17.2

      - name: Ruff check
        working-directory: ./backend
        run: ruff check app tests eval

      - name: Ruff format check
        working-directory: ./backend
        run: ruff format --check app tests eval

  backend-mypy:
    name: Backend mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + mypy
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install mypy==2.4.0

      - name: mypy (clean since 2026-10-26; blocking)
        working-directory: ./backend
        run: mypy app --ignore-missing-imports

  backend-security:
    name: Backend Security Scans (NON-BLOCKING, see SECURITY.md)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + scanners
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Bandit (11 Low, 0 Medium/High on phase-g branch)
        working-directory: ./backend
        run: bandit -r app

      - name: pip-audit (71 records on phase-g branch, documented risk)
        working-directory: ./backend
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend Lint + Typecheck + Tests + Build + E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Node 24, not 20: Vitest 5 requires Node ^22.12 || ^24
      # (CI on Node 20 fails in undici with EBADENGINE warnings;
      # local runs on Node 24 pass). Next 14 itself runs on 20,
      # but the test toolchain does not.
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # --legacy-peer-deps matches the repo's install convention
      # (Dockerfile, setup.ps1): plain npm ci fails on vitest 5 /
      # vite / @types/node peer conflicts, which are upstream and
      # unrelated to this project's code.
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Vitest
        working-directory: ./frontend
        run: npm test

      - name: Next.js build
        working-directory: ./frontend
        run: npm run build

      - name: Install Playwright chromium
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      # Server and tests share one step on purpose: a background
      # process started in one Actions step is not guaranteed to
      # survive into the next step.
      - name: Playwright E2E (mock-API mode, no OpenAI key needed)
        working-directory: ./frontend
        env:
          E2E_RUN: "1"
          E2E_MOCK_API: "1"
          PLAYWRIGHT_BASE_URL: "http://localhost:3000"
        run: |
          (npm run start -- -p 3000 > /tmp/next-start.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/login > /dev/null && break
            sleep 2
          done
          npx playwright test

  frontend-security:
    name: Frontend npm audit (NON-BLOCKING, see SECURITY.md)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Node 24, not 20: Vitest 5 requires Node ^22.12 || ^24
      # (CI on Node 20 fails in undici with EBADENGINE warnings;
      # local runs on Node 24 pass). Next 14 itself runs on 20,
      # but the test toolchain does not.
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # --legacy-peer-deps matches the repo's install convention
      # (Dockerfile, setup.ps1): plain npm ci fails on vitest 5 /
      # vite / @types/node peer conflicts, which are upstream and
      # unrelated to this project's code.
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: npm audit
        working-directory: ./frontend
        run: npm audit --audit-level=moderate

  docker-build:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build ./backend -t rag-backend:ci

      - name: Build frontend image
        run: docker build ./frontend -t rag-frontend:ci

  compose-smoke:
    name: Compose Smoke Test (/health + /ready, test key only)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The smoke test proves the stack boots, migrates, and reports
      # ready. It does NOT prove chat works: the placeholder key is
      # presence-only (lifespan checks it exists, /ready checks
      # Postgres + Qdrant only). A real chat smoke needs a valid
      # OPENAI_API_KEY and is documented in docs/DEPLOYMENT.md.
      - name: Start stack with test key
        env:
          OPENAI_API_KEY: "test-smoke-key"
          JWT_SECRET_KEY: "ci-test-secret-key-minimum-32-chars-long"
        run: docker compose up -d --build || (docker compose logs; exit 1)

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/ready | grep -q '"status":"ready"'; then
              echo "backend ready"
              exit 0
            fi
            sleep 5
          done
          echo "backend never became ready"
          docker compose logs backend postgres qdrant
          exit 1

      - name: Check liveness and frontend
        run: |
          curl -fsS http://localhost:8000/health
          # Frontend needs a readiness wait too: the previous version
          # curled /login ~0.1s after the container started and got
          # "connection reset" from a Next server that was still
          # starting, even though the stack was healthy.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login > /dev/null; then
              echo "smoke OK"
              exit 0
            fi
            sleep 2
          done
          echo "frontend never became ready"
          docker compose logs frontend
          exit 1

      - name: Stop stack
        if: always()
        run: docker compose down -v
