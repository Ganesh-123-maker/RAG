[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
omit = ["alembic/*", "tests/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Keep ruff's default rule set (the set previous phases linted
# against); only ignore B008, because FastAPI Depends() in
# argument defaults is the documented FastAPI idiom, not a bug.
ignore = ["B008"]

[tool.coverage.report]
# Measured 91% on phase-g branch (122 tests); the gate is 80% so
# normal churn does not fail CI, but a real regression still does.
fail_under = 80

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Phase G status: mypy is NOT clean (14 pre-existing errors, see
# docs/phase-g-report.md). It runs as a non-blocking CI job until
# those are fixed; this config must not be loosened to hide them.
