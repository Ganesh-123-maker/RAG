
services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Qdrant ────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # No healthcheck here on purpose (Phase G): the qdrant/qdrant
    # image ships no wget/curl, so an in-container HTTP healthcheck
    # fails forever and `docker compose up` reports Qdrant unhealthy
    # even when it is running (proven by CI compose-smoke on PR #7).
    # Readiness is instead waited on by backend/entrypoint.sh
    # (Python stdlib poll of /healthz) and re-checked by /ready.

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    restart: unless-stopped
    # Optional: a missing .env must not break `docker compose up` itself.
    # First-run flow (documented in README/docs): `cp .env.example .env`
    # and set OPENAI_API_KEY (plus a real JWT_SECRET_KEY for anything
    # beyond local dev). Shell-exported OPENAI_API_KEY / JWT_SECRET_KEY
    # also work via the environment block below.
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      PYTHONPATH: /app
      # Override DATABASE_URL so it uses the Docker service name, not whatever is in .env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpassword}@postgres:5432/${POSTGRES_DB:-ragdb}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # service_started, not service_healthy: Qdrant has no
      # healthcheck (see above); entrypoint.sh waits for it.
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    # No command here: the backend image CMD (entrypoint.sh) runs
    # `alembic upgrade head` then uvicorn, so `docker run` works too.

  # ── Next.js Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    container_name: rag_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s


volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
